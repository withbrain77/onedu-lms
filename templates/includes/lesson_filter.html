<div class="lesson-filter mb-3" data-filter-controls hidden>
  <label class="form-label" for="lessonSearch">차시 제목 검색</label>
  <input class="form-control" id="lessonSearch" type="search" maxlength="100" placeholder="찾는 차시 제목을 입력하세요" data-filter-query>
  <label class="filter-checkbox mt-2"><input class="form-check-input" type="checkbox" data-filter-incomplete> 미완료 차시만 보기</label>
  <p class="small text-muted mb-0" role="status" aria-live="polite" data-filter-count></p>
</div>
<p class="text-muted" data-filter-empty hidden>조건에 맞는 차시가 없습니다. 검색어나 미완료 조건을 변경해 주세요.</p>
