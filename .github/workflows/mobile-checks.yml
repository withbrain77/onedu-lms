name: Mobile regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y fonts-nanum
      - run: python manage.py test --noinput 2>&1 | tee server-tests.log
      - run: npm run test:js
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-check-report
          path: |
            playwright-report/
            test-results/
            server-tests.log
          retention-days: 14
